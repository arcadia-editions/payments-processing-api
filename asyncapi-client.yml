asyncapi: 3.0.0
id: urn:com.arcadiaeditions:payments:processing:asyncapi:client

info:
  title: Arcadia Editions - Payments Processing - AsyncAPI Client
  version: "0.0.0"
  description: Consumed AsyncAPI channels for Arcadia Editions - Payments Processing.

x-application-bindings:
  x-principal: payments_processing
  x-clientId: payments_processing
  x-groupId: payments_processing

channels:
  fulfillment-scheduled-event-v1:
    $ref: https://raw.githubusercontent.com/arcadia-editions/fulfillment-shipping-api/main/asyncapi.yml#/channels/fulfillment-scheduled-event-v1

operations:
  onFulfillmentScheduledEventV1:
    action: receive
    channel:
      $ref: "#/channels/fulfillment-scheduled-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"
    bindings:
      kafka:
        x-error-topics:
          addressTemplate: "${groupId}.__.${channel.address}.${suffix}"
          retryTopics: 3
          retrySuffixes:
          - retry-5s
          - retry-30s
          - retry-5m
          retry:
            $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-error-topics.yml#/components/error-topics/retry/silver
          dlq:
            $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-error-topics.yml#/components/error-topics/dlq/compliance

components:
  messageTraits:
    CommonHeaders:
      $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-message-traits.yml#/components/messageTraits/CommonHeaders
  operationTraits:
    clientIdAndPrincipal:
      bindings:
        kafka:
          x-principal:
            $ref: "#/x-application-bindings/x-principal"
          x-groupId:
            $ref: "#/x-application-bindings/x-groupId"
